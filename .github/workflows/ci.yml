name: VulnScanner CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test module imports
      run: |
        python -c "from modules.port_scanner import run_port_scan; print('port_scanner OK')"
        python -c "from modules.http_scanner import check_http_vulnerabilities; print('http_scanner OK')"
        python -c "from modules.dns_recon import run_dns_recon; print('dns_recon OK')"
        python -c "from modules.vuln_analysis import calculate_risk_score; print('vuln_analysis OK')"
        python -c "from modules.report_generator import generate_html_report; print('report_generator OK')"

    - name: Test CLI help
      run: python scanner.py --help

    - name: Test risk scoring logic
      run: |
        python -c "
        from modules.vuln_analysis import calculate_risk_score
        vulns = [
          {'severity': 'CRITICAL', 'type': 'TEST'},
          {'severity': 'HIGH', 'type': 'TEST'},
          {'severity': 'MEDIUM', 'type': 'TEST'},
        ]
        score = calculate_risk_score(vulns)
        assert score['score'] == 40
        assert score['rating'] == 'MEDIUM'
        print('Risk scoring OK — score=' + str(score['score']) + ', rating=' + score['rating'])
        "

    - name: Test HTML report generation
      run: |
        python -c "
        import os, tempfile
        from modules.report_generator import generate_html_report
        scan_data = {
          'target': 'test.example.com',
          'timestamp': '2026-01-01 00:00:00',
          'modules_run': ['Port Scan'],
          'ports': [{'port': 80, 'service': 'HTTP', 'risk': 'LOW', 'banner': None}],
          'http': {'reachable': False},
          'dns': {},
          'all_vulnerabilities': [{'type': 'MISSING_SECURITY_HEADER', 'severity': 'HIGH', 'detail': 'Test'}],
          'risk_score': {'score': 10, 'rating': 'LOW', 'counts': {'CRITICAL':0,'HIGH':1,'MEDIUM':0,'LOW':0,'INFO':0}},
          'duration': '5.0s'
        }
        with tempfile.NamedTemporaryFile(suffix='.html', delete=False) as f:
          path = f.name
        generate_html_report(scan_data, path)
        size = os.path.getsize(path)
        os.unlink(path)
        assert size > 1000
        print('HTML report OK (' + str(size) + ' bytes)')
        "

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t vulnscanner:test .
    - name: Test Docker runs
      run: docker run --rm vulnscanner:test --help
