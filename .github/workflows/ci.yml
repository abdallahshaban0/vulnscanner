name: VulnScanner CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test module imports
      run: |
        python -c "from modules.port_scanner import run_port_scan; print('port_scanner OK')"
        python -c "from modules.http_scanner import check_http_vulnerabilities; print('http_scanner OK')"
        python -c "from modules.dns_recon import run_dns_recon; print('dns_recon OK')"
        python -c "from modules.vuln_analysis import calculate_risk_score; print('vuln_analysis OK')"
        python -c "from modules.report_generator import generate_html_report; print('report_generator OK')"
        python -c "from app import app; print('Flask app OK')"

    - name: Test CLI
      run: python scanner.py --help

    - name: Test Flask routes
      run: |
        python -c "
        from app import app
        with app.test_client() as c:
          r = c.get('/')
          assert r.status_code == 200, f'Expected 200, got {r.status_code}'
          print('GET / =>', r.status_code, 'OK')
        "

    - name: Test risk scoring
      run: |
        python -c "
        from modules.vuln_analysis import calculate_risk_score
        score = calculate_risk_score([{'severity':'CRITICAL','type':'T'},{'severity':'HIGH','type':'T'}])
        assert score['score'] == 35
        print('Risk score OK:', score['score'])
        "

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - run: docker build -t vulnscanner:test .
    - run: docker run --rm vulnscanner:test --help
